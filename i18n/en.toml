# Legacy audit keys retained for other pages that may reference them.
[cisosComplianceLabel]
other = "Compliance & Governance"

[cisosComplianceTitle]
other = "Built for audit-ready security programs"

[cisosCard1Title]
other = "Exposure, quantified"

[cisosCard1Desc]
other = "Runtime risk score across threats, assets, telemetry and detection coverage. One number, drillable to the specific items driving it."

[cisosCard2Title]
other = "Silently broken rules"

[cisosCard2Desc]
other = "Industry data says only 5% of deployed detections actually work. We flag the dead ones in real time, so a rule count never gives false comfort again."

[cisosCard3Title]
other = "Board-ready metrics"

[cisosCard3Desc]
other = "MTTD, MTTR, noise rate and MITRE coverage trending over time. Exportable. No spreadsheet archaeology the night before the meeting."

[cisosCard4Title]
other = "Sovereignty-ready"

[cisosCard4Desc]
other = "Secured SaaS, customer-governed KMS paths, on-premises and private-cloud deployment options for teams with data residency or infrastructure-control requirements."

[cisosSovereigntyLabel]
other = "Cloud Sovereignty"

[cisosSovereigntyTitle]
other = "Keep the control boundary where policy needs it"

[cisosSovereigntyDescription]
other = "Choose SaaS with hardened GCP controls, add customer-governed key access for sovereign cloud requirements, or run CraftedSignal in your own private cloud or air-gapped environment."

[cisosSovereigntyCard1Title]
other = "Secured SaaS"

[cisosSovereigntyCard1Desc]
other = "Private GKE and Cloud SQL, regional KMS/CMEK, Cloud Armor, signed releases, manual deployment approval and Binary Authorization attestations. Your logs stay in your SIEM."

[cisosSovereigntyCard2Title]
other = "Application-level encryption"

[cisosSovereigntyCard2Desc]
other = "Tenant data-encryption keys are wrapped by a KEK. Sovereign deployments can place that KEK under customer governance and release it through an attested key-broker path."

[cisosSovereigntyCard3Title]
other = "Confidential computing"

[cisosSovereigntyCard3Desc]
other = "Confidential Space can gate key access to stable attested workloads. Supported Confidential GKE Nodes or Confidential VMs add encrypted memory for data in use."

[cisosSovereigntyCard4Title]
other = "Private deployment"

[cisosSovereigntyCard4Desc]
other = "Run the same control plane on-premises, in a private cloud, or fully air-gapped with local models, internal feed mirrors and customer-operated network boundaries."

[cisosTestingTitle]
other = "Independent penetration testing"

[cisosTestingDesc]
other = "Third-party penetration testing and major-change security reviews are part of the assurance program. Findings are triaged, remediated and tracked through closure."

[cisosAiLabel]
other = "Automation Governance"

[cisosAiTitle]
other = "Assistance that never acts alone"

[cisosAiDescription]
other = "Generated changes stay under human control. CraftedSignal can draft, test and suggest fixes, but your team reviews and approves. Nothing deploys without explicit authorization."

