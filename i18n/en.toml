[valueProp1Title]
other = "Answer does it affect us"

[valueProp1Desc]
other = "Start lightweight: import assets, paste a plain description, or add services manually. CraftedSignal uses that business surface with threats, findings and telemetry to show what is relevant."

[valueProp2Title]
other = "One Backlog, risk-scored"

[valueProp2Desc]
other = "New detections, false-positive tuning, missing telemetry, broken rules, mappings, tests and approvals land in the same queue. Meta-work inherits priority from what it unblocks."

[valueProp3Title]
other = "Fix safely, then prove it"

[valueProp3Desc]
other = "Operators get direct actions: tune, map, test, enable telemetry, adopt a rule, hunt, accept residual risk or roll back. Impact preview and approvals keep production controlled."

[valueProp4Title]
other = "Write Sigma, deploy everywhere"

[valueProp4Desc]
other = "Author in Sigma and convert to Splunk, Sentinel, CrowdStrike and Rapid7. Import native rules and translate to Sigma for portability, or keep writing in your SIEM's own language."

[valueProp16Title]
other = "Runbooks that stay in sync"

[valueProp16Desc]
other = "Attach runbooks and playbooks to detections and hunts. Draft, review and refresh them from the same rule, test, threat and business details operators already inspect."

[valuePropLearnMore]
other = "Learn more →"

# ──────────────────────────────────────────────
# Homepage – How It Works (how-it-works.html)
# ──────────────────────────────────────────────

[howItWorksLabel]
other = "How it works"

[howItWorksTitle]
other = "From threat to risk-reducing work"

[howItWorksLede]
other = "Most detection tools start with a rule. CraftedSignal starts with the question that matters: does this affect us, can we see it, and are we covered?"

[howItWorksConnectTitle]
other = "Connect and import"

[howItWorksConnectDesc]
other = "Plug into Splunk, Sentinel, CrowdStrike and Rapid7, then import the rules you already run. Outbound-only agents query existing tools without moving raw logs into CraftedSignal."

[howItWorksRiskTitle]
other = "Add business surface"

[howItWorksRiskDesc]
other = "Give as much or as little context as you have: manual services, regular imports, a free-text asset description today; CMDB, scanners and mapping later."

[howItWorksThreatTitle]
other = "Triage threats and findings"

[howItWorksThreatDesc]
other = "Threat briefs, critical CVEs, pentest findings and future CTEM inputs are scored against the business surface, telemetry and current rule coverage."

[howItWorksHuntTitle]
other = "Work one Backlog"

[howItWorksHuntDesc]
other = "Analysts and engineers see one risk-scored queue for rules, tuning, hunts, missing log sources, broken tests, mappings, approvals and residual-risk decisions."

[howItWorksRuleTitle]
other = "Verify in your environment"

[howItWorksRuleDesc]
other = "Run tests and hunts against live SIEMs, check source mappings, preview alert volume and keep response steps with the rule before anything promotes."

[howItWorksCoverageTitle]
other = "Watch runtime risk"

[howItWorksCoverageDesc]
other = "Risk scores change as threats move, assets change, rules break, false positives rise or telemetry disappears. Dashboards show what to know and what to focus on."

# Legacy keys retained for pages still using them.
[howItWorksStep1Title]
other = "Connect & import"

[howItWorksStep1Desc]
other = "Connect your SIEM and import existing rules; they're auto-converted to Sigma for portability. Or start from threat briefs, findings and the standard rules repo."

[howItWorksStep2Title]
other = "Generate & test"

[howItWorksStep2Desc]
other = "Generate or write rules with tests, in code or the web UI. Run them live on your SIEM to validate before promotion."

[howItWorksStep3Title]
other = "Approve & deploy"

[howItWorksStep3Desc]
other = "Review impact before production. Deploy with approval workflows. Rollback in one click. Measure coverage and quality continuously."

